[project]
name = "codex-tango"
version = "0.1.0"
description = "Python prototype for a Tango-style binary logic puzzle."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tango*"]
exclude = ["docs*", "generated*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
